name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@cross
        if: matrix.cross

      - name: Build
        run: |
          set -eu
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Package
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="dev"
          fi
          mkdir -p dist
          tar -czf "dist/i3-editor-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" i3-editor
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "i3-editor-${{ matrix.target }}.tar.gz" \
                > "i3-editor-${{ matrix.target }}.tar.gz.sha256" )
          else
            ( cd dist && shasum -a 256 "i3-editor-${{ matrix.target }}.tar.gz" \
                > "i3-editor-${{ matrix.target }}.tar.gz.sha256" )
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: i3-editor-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
