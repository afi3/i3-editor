[package]
name = "i3-editor"
version = "0.1.5"
edition = "2024"
rust-version = "1.91"
description = "A keyboard-first terminal text editor with file explorer, panes, workspaces, Git, LSP, and Lua plugins."
repository = "https://github.com/afi3/i3-editor"
license = "MIT"
readme = "README.md"

[dependencies]
ignore = "0.4"
nucleo = "0.5.0"
notify = "8.2"
portable-pty = "0.9"
ratatui = "0.30"
regex = "1"
ropey = "1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5"
tree-sitter-md = { version = "0.5.4", features = ["parser"] }
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-segmentation = "1.13"
unicode-width = "0.2"
vt100 = "0.18"
mlua = { version = "0.12", features = ["lua54", "vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
